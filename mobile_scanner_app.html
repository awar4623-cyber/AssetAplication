<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAMS - Mobile Scanner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; } /* slate-900 background to emphasize mobile frame */
        
        /* Mobile Frame Wrapper */
        .mobile-frame {
            width: 100%;
            max-width: 414px; /* iPhone Max width */
            height: 100vh;
            max-height: 896px;
            margin: 0 auto;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Camera UI Mockup */
        .scanner-window {
            position: relative;
            height: 60%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scan-box {
            width: 250px;
            height: 250px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .scan-box::before, .scan-box::after,
        .scan-box span::before, .scan-box span::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #3b82f6; /* blue-500 */
            border-style: solid;
        }

        /* Top left corner */
        .scan-box::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        /* Top right corner */
        .scan-box::after { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
        /* Bottom left corner */
        .scan-box span::before { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
        /* Bottom right corner */
        .scan-box span::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }

        .scan-line {
            width: 100%;
            height: 2px;
            background-color: #ef4444; /* red-500 */
            position: absolute;
            top: 0;
            animation: scan 2s infinite linear;
            box-shadow: 0 0 10px #ef4444;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Result Bottom Sheet */
        .bottom-sheet {
            flex: 1;
            background: white;
            border-radius: 24px 24px 0 0;
            margin-top: -24px;
            z-index: 10;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
        }

        .bottom-sheet.active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- App Container -->
    <div class="mobile-frame lg:my-8 lg:rounded-3xl lg:border-8 lg:border-slate-800">
        
        <!-- Header -->
        <div class="absolute top-0 w-full z-20 p-4 flex justify-between items-center text-white bg-gradient-to-b from-black/70 to-transparent">
            <button class="w-10 h-10 rounded-full bg-black/40 flex items-center justify-center backdrop-blur-sm"><i class="fas fa-chevron-left"></i></button>
            <h1 class="font-semibold tracking-wide">Stock Opname</h1>
            <button class="w-10 h-10 rounded-full bg-black/40 flex items-center justify-center backdrop-blur-sm"><i class="fas fa-bolt"></i></button>
        </div>

        <!-- Camera Area -->
        <div class="scanner-window" id="cameraView">
            <div class="text-center absolute w-full z-10 top-20 text-white opacity-70">
                <p class="text-sm">Point camera at Asset QR Code</p>
            </div>
            
            <div class="scan-box">
                <span></span>
                <div class="scan-line" id="scanLine"></div>
            </div>

            <!-- Fake a button to simulate a successful scan for the demo -->
            <button onclick="simulateScan()" class="absolute bottom-10 px-6 py-2 bg-blue-600/80 text-white rounded-full text-sm font-medium border border-blue-400 backdrop-blur-md">
                <i class="fas fa-magic mr-2"></i> Simulate Scan
            </button>
        </div>

        <!-- Idle Status Area -->
        <div class="flex-1 bg-slate-50 p-6 flex flex-col items-center justify-center" id="idleState">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl mb-4">
                <i class="fas fa-qrcode"></i>
            </div>
            <h3 class="font-semibold text-slate-800">Ready to Scan</h3>
            <p class="text-xs text-slate-500 text-center mt-2 px-4">Ensure good lighting and hold the camera steady over the tag.</p>
        </div>

        <!-- Bottom Sheet (Scan Result) -->
        <div class="bottom-sheet shadow-[0_-10px_40px_rgba(0,0,0,0.1)] absolute bottom-0 w-full h-[65%]" id="resultSheet">
            <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-6"></div>
            
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold uppercase tracking-wider rounded-full">Verified</span>
                    <h2 class="text-xl font-bold text-slate-800 mt-2" id="resName">Dell XPS 15 Laptop</h2>
                    <p class="text-sm font-mono text-slate-500 mt-1" id="resCode">AST-2026-9012</p>
                </div>
                <div class="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center text-slate-400">
                    <i class="fas fa-laptop text-xl"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Location</p>
                    <p class="text-sm font-medium text-slate-700 mt-1">IT Department, HQ</p>
                </div>
                <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Custodian</p>
                    <p class="text-sm font-medium text-slate-700 mt-1">Budi Santoso</p>
                </div>
            </div>

            <form class="space-y-4 flex-1 overflow-y-auto pb-4" onsubmit="event.preventDefault(); alert('Audit saved!'); closeSheet();">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Current Condition</label>
                    <div class="flex space-x-2">
                        <label class="flex-1 text-center py-2 border border-slate-200 rounded-md text-sm font-medium text-green-600 bg-green-50 cursor-pointer">
                            <input type="radio" name="cond" checked class="hidden"> Good
                        </label>
                        <label class="flex-1 text-center py-2 border border-slate-200 rounded-md text-sm font-medium text-yellow-600 cursor-pointer hover:bg-yellow-50">
                            <input type="radio" name="cond" class="hidden"> Fair
                        </label>
                        <label class="flex-1 text-center py-2 border border-slate-200 rounded-md text-sm font-medium text-red-600 cursor-pointer hover:bg-red-50">
                            <input type="radio" name="cond" class="hidden"> Broken
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Audit Notes</label>
                    <textarea class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500" rows="2" placeholder="Optional notes..."></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 bg-blue-600 text-white rounded-xl font-semibold shadow-md hover:bg-blue-700 active:scale-95 transition-transform">
                        Confirm & Save Audit
                    </button>
                    <button type="button" onclick="closeSheet()" class="w-full py-3 mt-2 text-slate-500 font-medium hover:text-slate-700">
                        Cancel
                    </button>
                </div>
            </form>
        </div>

    </div>

    <script>
        const sheet = document.getElementById('resultSheet');
        const scanLine = document.getElementById('scanLine');

        function simulateScan() {
            // Play a fake beep sound using Web Audio API (optional/simple approach)
            beep();
            
            // Stop scanning animation
            scanLine.style.animation = 'none';
            scanLine.style.opacity = '0';

            // Show sheet
            sheet.classList.add('active');
        }

        function closeSheet() {
            sheet.classList.remove('active');
            
            // Reset scanner after a delay
            setTimeout(() => {
                scanLine.style.animation = 'scan 2s infinite linear';
            }, 300);
        }

        // Simple beep generator
        function beep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {
                console.log("Audio not supported");
            }
        }
    </script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const userName = localStorage.getItem('eams_user_name');
        const userDivision = localStorage.getItem('eams_user_division');
        const userRole = localStorage.getItem('eams_user_role');
        
        if (userName) {
            const nameEl = document.getElementById('sidebarUserName');
            if (nameEl) nameEl.textContent = userName;
            
            const avatarEl = document.getElementById('sidebarUserAvatar');
            if (avatarEl) {
                const initials = userName.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
                avatarEl.textContent = initials;
            }
        }
        if (userDivision) {
            const roleEl = document.getElementById('sidebarUserRole');
            if (roleEl) {
                if (userRole === 'admin') {
                    roleEl.textContent = 'Admin - ' + userDivision;
                } else {
                    roleEl.textContent = 'Staff - ' + userDivision;
                }
            }
        }
    });
</script>
</body>
</html>
