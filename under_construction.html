<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAMS - Module Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 flex items-center justify-center h-screen">

    <div class="text-center p-8 bg-white rounded-2xl shadow-sm border border-slate-200 max-w-md">
        <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
            <i class="fas fa-tools"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Module Under Construction</h2>
        <p class="text-slate-500 mb-8">This enterprise module is currently being developed and will be available in the next sprint.</p>
        <a href="executive_dashboard.html" class="px-6 py-2 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700 transition">Kembali ke Dasbor</a>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const userName = localStorage.getItem('eams_user_name');
        const userDivision = localStorage.getItem('eams_user_division');
        const userRole = localStorage.getItem('eams_user_role');
        
        if (userName) {
            const nameEl = document.getElementById('sidebarUserName');
            if (nameEl) nameEl.textContent = userName;
            
            const avatarEl = document.getElementById('sidebarUserAvatar');
            if (avatarEl) {
                const initials = userName.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
                avatarEl.textContent = initials;
            }
        }
        if (userDivision) {
            const roleEl = document.getElementById('sidebarUserRole');
            if (roleEl) {
                if (userRole === 'admin') {
                    roleEl.textContent = 'Admin - ' + userDivision;
                } else {
                    roleEl.textContent = 'Staff - ' + userDivision;
                }
            }
        }
    });
</script>
</body>
</html>
